# 互动微服务本地开发配置，由 main.initViper 加载。
db:
  dsn: "root:root@tcp(localhost:13316)/gobook?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"

kafka:
  # 使用列表便于后续配置多个 broker。
  addr:
    - "localhost:9094"

grpc:
  server:
    # net.Listen 接受的完整监听地址；空主机表示监听所有本机网卡。
    addr: ":8090"
