syntax = "proto3";

package interactive.v1;

option go_package = "GoBook/api/proto/gen/interactive/v1;interactivev1";

// InteractiveService 提供跨业务复用的阅读、点赞和收藏能力。
service InteractiveService {
  // IncrReadCnt 增加一次阅读数，通常由 Kafka 阅读事件消费者调用。
  rpc IncrReadCnt(IncrReadCntRequest) returns (IncrReadCntResponse);

  // Like 记录用户点赞；重复请求由服务端保证幂等。
  rpc Like(LikeRequest) returns (LikeResponse);

  // CancelLike 取消用户点赞。
  rpc CancelLike(CancelLikeRequest) returns (CancelLikeResponse);

  // Get 获取聚合计数及当前用户的点赞、收藏状态。
  rpc Get(GetRequest) returns (GetResponse);

  // GetByIds 批量获取互动数据，用于排行榜等批处理场景。
  rpc GetByIds(GetByIdsRequest) returns (GetByIdsResponse);

  // Collect 将业务对象加入指定收藏夹并更新聚合收藏数。
  rpc Collect(CollectRequest) returns (CollectResponse);
}

message IncrReadCntRequest {
  string biz = 1;
  int64 biz_id = 2;
}

message IncrReadCntResponse {}

message LikeRequest {
  string biz = 1;
  int64 biz_id = 2;
  int64 uid = 3;
}

message LikeResponse {}

message CancelLikeRequest {
  string biz = 1;
  int64 biz_id = 2;
  int64 uid = 3;
}

message CancelLikeResponse {}

// Interactive 表示一个业务对象的聚合互动数据及用户态信息。
message Interactive {
  string biz = 1;
  int64 biz_id = 2;
  int64 read_cnt = 3;
  int64 like_cnt = 4;
  int64 collect_cnt = 5;
  bool liked = 6;
  bool collected = 7;
}

message GetRequest {
  string biz = 1;
  int64 biz_id = 2;
  int64 uid = 3;
}

message GetResponse {
  Interactive inter = 1;
}

message GetByIdsRequest {
  string biz = 1;
  repeated int64 ids = 2;
}

message GetByIdsResponse {
  map<int64, Interactive> inters = 1;
}

message CollectRequest {
  string biz = 1;
  // biz_id 是被收藏的业务对象 ID。
  int64 biz_id = 2;
  // cid 是目标收藏夹 ID。
  int64 cid = 3;
  // uid 是执行收藏的用户 ID。
  int64 uid = 4;
}

message CollectResponse {}
